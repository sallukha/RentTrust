services:
  - type: web
    name: renttrust-chat
    runtime: docker
    plan: free
    rootDir: chat_backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: Marketplace Chat API
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DEBUG
        value: "false"
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: renttrust-chat-db
          property: connectionString

databases:
  - name: renttrust-chat-db
    plan: free
    databaseName: chat_db
    user: chat_user